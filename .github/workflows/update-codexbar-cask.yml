name: Update CodexBar Cask

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g., 0.29.2)'
        required: true
      sha256:
        description: 'SHA256 of the zip archive'
        required: true

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update cask version and checksum
        run: |
          set -euo pipefail
          VERSION="${{ inputs.version }}"
          SHA256="${{ inputs.sha256 }}"
          CASK="Casks/codexbar.rb"

          sed -i "s/version \".*\"/version \"${VERSION}\"/" "$CASK"
          sed -i "s/sha256 \".*\"/sha256 \"${SHA256}\"/" "$CASK"

          echo "Updated cask:"
          cat "$CASK"

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add Casks/codexbar.rb
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "cask: update codexbar to ${{ inputs.version }}"
          git push
